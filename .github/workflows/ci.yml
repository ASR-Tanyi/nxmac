# nxmac's CI: every preset configured, built and tested.
#   Linux:  the portable parts (core, tools, tests), plain and under each sanitizer. Cheap and fast; the host and gfx are Mac-only.
#   Mac:    everything, the host built for GAME, plain and under each sanitizer, then the tests and an nxhost start.
#   Lint:   clang-format and clang-tidy (the tidy preset: findings and warnings fail the build), at the LLVM nxnative's lint-c.yml pins.
# GitHub's macOS runners are virtual Macs without Metal 4 (nxnative issue #112): anything that needs a real GPU stays a local test.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request replaces its older run; a push to main never cancels, so main always has a finished run (as nxnative's tests.yml)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The game the host is built for (any profile does: the tests are about code), and the nxnative commit its profile is taken from. Pinned, so
  # nxnative's main moving does not change CI: raise it on purpose, with the build that checks it.
  GAME: 01007EF00011E000
  NXNATIVE_REF: f20f650781d3a50710645d2bc4d54e675eba5576
  # The toolchain nxnative supports (its README: Xcode 27.2) on GitHub's xcode-27 image, named by path so the image's default moving does not move CI
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: 1
  # The LLVM release of nxnative's lint-c.yml, and the sha256 of its macOS arm64 archive: clang-tidy and clang-format come from it
  LLVM_VERSION: 23.1.4
  LLVM_SHA256: 0f8b0db925ab54a63028d788e85b14abaa25492e9608819728c17f6786948da4

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment): a tag can be moved, a SHA cannot. The same pins as nxnative's workflows.
jobs:
  linux:
    name: Linux ${{ matrix.preset }} (core, tools, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, tsan]
    env:
      PRESET: ${{ matrix.preset }}
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ninja and clang's sanitizer runtimes
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libclang-rt-18-dev
          cmake --version | head -1
      - name: Fewer random bits in mmap addresses (TSan)
        if: matrix.preset == 'tsan'
        # TSan's shadow memory layout cannot take the 32 bits of mmap randomness the runner's kernel uses; 28 is the usual setting
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure, build and test
        run: cmake --workflow --preset "$PRESET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-linux-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 7

  mac:
    name: Mac ${{ matrix.preset }} (host, gfx, core, tests)
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, tsan]
    env:
      PRESET: ${{ matrix.preset }}
    defaults:
      run:
        working-directory: nxmac
    steps:
      # Side by side, as on a developer's Mac: nxmac finds the profiles at ../nxnative (NXNATIVE_DIR's default)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nxmac
          persist-credentials: false
      - name: nxnative's profile of the game (dm/games/GAME and dm/games/game.py only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seedds/nxnative
          ref: ${{ env.NXNATIVE_REF }}
          path: nxnative
          persist-credentials: false
          filter: blob:none
          sparse-checkout: dm/games/${{ env.GAME }}
      # The xcode-27 image has CMake, Ninja, zstd and a Python 3.12 or newer (game.py writes the profile header); the installs are fallbacks
      - name: Toolchain
        run: |
          command -v ninja || brew install ninja
          command -v cmake || brew install cmake
          xcodebuild -version
          cmake --version | head -1
          python3 --version
      - name: Configure
        run: cmake --preset "$PRESET" -DNXMAC_GAME="$GAME"
      - name: Build
        run: cmake --build --preset "$PRESET"
      - name: Unit tests
        run: ctest --preset "$PRESET"
      - name: nxhost starts
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/nxmac/sanitizers/tsan.supp
        run: build/"$PRESET"/bin/nxhost
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-mac-${{ matrix.preset }}
          path: nxmac/build/${{ matrix.preset }}/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: clang-format and clang-tidy
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nxmac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nxmac
          persist-credentials: false
      - name: nxnative's profile of the game (the host's sources are checked too)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seedds/nxnative
          ref: ${{ env.NXNATIVE_REF }}
          path: nxnative
          persist-credentials: false
          filter: blob:none
          sparse-checkout: dm/games/${{ env.GAME }}
      # As nxnative's lint-c.yml: an 870 MB archive, of which clang-tidy, clang-format and clang's own headers are unpacked (about 30 s)
      - name: LLVM ${{ env.LLVM_VERSION }} (clang-tidy, clang-format)
        run: |
          name="LLVM-$LLVM_VERSION-macOS-ARM64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.tar.zst" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.zst"
          echo "$LLVM_SHA256  $RUNNER_TEMP/llvm.tar.zst" | shasum -a 256 -c -
          command -v zstd || brew install zstd
          command -v ninja || brew install ninja
          command -v cmake || brew install cmake
          mkdir -p "$RUNNER_TEMP/llvm"
          # the archive is compressed with a 1 GB window (--long=30)
          zstd -dc --long=30 "$RUNNER_TEMP/llvm.tar.zst" | tar -x -C "$RUNNER_TEMP/llvm" --strip-components 1 \
            "$name/bin/clang-tidy" "$name/bin/clang-format" "$name/lib/clang/${LLVM_VERSION%%.*}/include"
          rm "$RUNNER_TEMP/llvm.tar.zst"
          echo "LLVM=$RUNNER_TEMP/llvm" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/llvm/bin/clang-tidy" --version
          "$RUNNER_TEMP/llvm/bin/clang-format" --version
      - name: Configure (the tidy preset, with this LLVM's tools)
        run: cmake --preset tidy -DNXMAC_GAME="$GAME" -DNXMAC_CLANG_TIDY_EXE="$LLVM/bin/clang-tidy" -DNXMAC_CLANG_FORMAT_EXE="$LLVM/bin/clang-format"
      - name: clang-format
        run: cmake --build --preset tidy --target format-check
      - name: clang-tidy on every nxmac source (findings and warnings fail the build)
        if: ${{ !cancelled() }}
        run: cmake --build --preset tidy
